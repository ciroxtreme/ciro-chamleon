name: Ciro Chamleon Telemetry Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Pilih aksi: scan (tambah baru) atau retest (uji & bersihkan brankas)'
        required: false
        default: 'scan'

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Network & SOCKS Dependencies
        run: |
          pip install --quiet PySocks urllib3 curl_cffi

      - name: Run Selected Engine
        run: |
          if [ "${{ github.event.inputs.action }}" = "retest" ]; then
            echo "🩺 Menjalankan Re-test Engine (Multi-Protocol HTTP/SOCKS)..."
            python retest_engine.py
          else
            echo "🦎 Menjalankan Mass Telemetry Scanner..."
            python scout_engine.py
          fi

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Ciro Chamleon Bot"
          git config --global user.email "chamleon@ciroxtreme.internal"
          git add residential_vault.txt residential_vault.json || true
          git commit -m "chore: telemetry synchronization [skip ci]" || true
          git push origin main || true
