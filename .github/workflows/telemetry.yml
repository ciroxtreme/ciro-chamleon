name: Ciro Chamleon Telemetry Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'scan (uji ulang vault + cari proxy baru) atau retest (uji ulang vault saja)'
        required: false
        default: 'scan'

permissions:
  contents: write

concurrency:
  group: chamleon-telemetry
  cancel-in-progress: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install --quiet curl_cffi

      - name: Run Selected Engine
        run: |
          if [ "${{ github.event.inputs.action }}" = "retest" ]; then
            python retest_engine.py
          else
            python scout_engine.py
          fi

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Ciro Chamleon Bot"
          git config --global user.email "chamleon@ciroxtreme.internal"
          git add residential_vault.txt residential_vault.json usable/
          git commit -m "chore: telemetry synchronization [skip ci]" || exit 0
          git pull --rebase -X theirs origin main
          git push origin main
