name: Ciro Chamleon Telemetry Pipeline

on:
  schedule:
    # Berjalan otomatis setiap 3 jam untuk menyerap IP-IP gratisan baru yang baru rilis
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Mass Telemetry Scanner
        run: |
          python scout_engine.py

      - name: Commit & Accumulate to Storage
        run: |
          git config --global user.name "Ciro Chamleon Bot"
          git config --global user.email "chamleon@ciroxtreme.internal"
          git add residential_vault.txt residential_vault.json || true
          git commit -m "chore: accumulate verified residential proxies [skip ci]" || true
          git push origin main || true
